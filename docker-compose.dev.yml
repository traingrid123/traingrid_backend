services:
  backend-api:
    build:
      context: .
      target: dev
    container_name: traingrid-backend-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    command: >
      sh -c "pnpm install --frozen-lockfile &&
             pnpm prisma generate &&
             pnpm run dev"
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: traingrid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  backend_node_modules:
    driver: local
  redis_data:
    driver: local
